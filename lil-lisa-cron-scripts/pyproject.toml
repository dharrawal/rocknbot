[project]
name = "lil-lisa-cron-scripts"
version = "2.6.2"
description = "Nightly techsupport pipeline (DSPy classifier, ingest, GitHub push). Not part of the LilLisa_Server API image."
requires-python = ">=3.11,<3.12"
dependencies = [
    "dspy>=2.6.27",
    "requests==2.31.0",
    "LilLisa_Server",
]

[project.optional-dependencies]
dev = [
    "isort==5.12.0",
    "black==23.1.0",
    "flake8==6.0.0",
    "pylint==2.16.1",
    "mypy==1.0.0",
    "bandit[toml]==1.7.4",
]

[tool.uv]
package = false
extra-index-url = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
LilLisa_Server = { path = "../LilLisa_Server" }

[tool.isort]
profile = "black"
line-length = 119

[tool.black]
line-length = 119

[tool.pylint.messages_control]
max-line-length = 119
disable = ["line-too-long", "import-error", "R0801"]

[tool.mypy]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
